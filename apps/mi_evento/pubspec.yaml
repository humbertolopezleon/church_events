name: mi_evento
description: Mi Evento — registro de asistentes a eventos (Android y Windows, 100 % offline).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  mi_evento_core:
    path: ../../packages/mi_evento_core
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  flutter_riverpod: ^2.5.1
  material_ui: ^1.11.1
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.1
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.12
  archive: ^4.7.1

flutter:
  uses-material-design: true
  fonts:
    - family: Atkinson
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
